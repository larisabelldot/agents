<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Crossy Roads 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Menu -->
    <div id="mainMenu" class="menu-screen">
        <div class="menu-content">
            <h1 class="game-title">🎮 EPIC CROSSY ROADS 3D 🎮</h1>
            <div class="menu-buttons">
                <button id="playBtn" class="menu-btn">PLAY</button>
                <button id="charactersBtn" class="menu-btn">CHARACTERS</button>
                <button id="achievementsBtn" class="menu-btn">ACHIEVEMENTS</button>
                <button id="settingsBtn" class="menu-btn">SETTINGS</button>
            </div>
            <div class="stats-display">
                <p>High Score: <span id="highScore">0</span></p>
                <p>Coins: <span id="totalCoins">0</span></p>
            </div>
        </div>
    </div>

    <!-- Character Selection -->
    <div id="characterMenu" class="menu-screen hidden">
        <div class="menu-content">
            <h2>Select Character</h2>
            <div id="characterGrid" class="character-grid"></div>
            <button id="backFromCharacters" class="menu-btn">BACK</button>
        </div>
    </div>

    <!-- Achievements -->
    <div id="achievementsMenu" class="menu-screen hidden">
        <div class="menu-content">
            <h2>Achievements</h2>
            <div id="achievementsList" class="achievements-list"></div>
            <button id="backFromAchievements" class="menu-btn">BACK</button>
        </div>
    </div>

    <!-- Settings -->
    <div id="settingsMenu" class="menu-screen hidden">
        <div class="menu-content">
            <h2>Settings</h2>
            <div class="settings-panel">
                <div class="setting-item">
                    <label>Music Volume: <span id="musicVolumeLabel">50</span>%</label>
                    <input type="range" id="musicVolume" min="0" max="100" value="50">
                </div>
                <div class="setting-item">
                    <label>SFX Volume: <span id="sfxVolumeLabel">50</span>%</label>
                    <input type="range" id="sfxVolume" min="0" max="100" value="50">
                </div>
                <div class="setting-item">
                    <label>Graphics Quality:</label>
                    <select id="graphicsQuality">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>
                        <input type="checkbox" id="particlesToggle" checked>
                        Particle Effects
                    </label>
                </div>
                <div class="setting-item">
                    <label>
                        <input type="checkbox" id="weatherToggle" checked>
                        Weather Effects
                    </label>
                </div>
            </div>
            <button id="backFromSettings" class="menu-btn">BACK</button>
        </div>
    </div>

    <!-- Game HUD -->
    <div id="gameHUD" class="hidden">
        <div class="hud-top">
            <div class="score-display">
                <span class="label">Score:</span>
                <span id="scoreValue">0</span>
            </div>
            <div class="combo-display">
                <span id="comboValue"></span>
            </div>
            <div class="coins-display">
                <span class="label">🪙</span>
                <span id="coinsValue">0</span>
            </div>
        </div>
        <div class="hud-powerups">
            <div id="powerupIndicator" class="powerup-indicator hidden"></div>
        </div>
        <div class="controls-hint">
            <p>🎮 Arrow Keys / WASD / Touch to Move</p>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="menu-screen hidden">
        <div class="menu-content">
            <h1 class="game-over-title">GAME OVER</h1>
            <div class="game-over-stats">
                <p class="big-score">Score: <span id="finalScore">0</span></p>
                <p>High Score: <span id="finalHighScore">0</span></p>
                <p>Coins Collected: <span id="finalCoins">0</span></p>
                <div id="newAchievements"></div>
            </div>
            <div class="menu-buttons">
                <button id="retryBtn" class="menu-btn">RETRY</button>
                <button id="menuBtn" class="menu-btn">MAIN MENU</button>
            </div>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-content">
            <h2>Loading Epic Crossy Roads...</h2>
            <div class="loading-bar">
                <div id="loadingProgress" class="loading-progress"></div>
            </div>
        </div>
    </div>

    <!-- Game Canvas -->
    <div id="gameContainer"></div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Game Script -->
    <script src="game.js"></script>
</body>
</html>
